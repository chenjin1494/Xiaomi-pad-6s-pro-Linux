# =============================================================================
# Build SteamOS (debootstrap + 并行 .deb 组件构建)
# =============================================================================
# 参�?debian-sheng 架构:
#   1. 并行 Job 构建各组�?.deb
#   2. 最�?Job �?debootstrap 创建基础系统 + 安装所�?.deb
# =============================================================================

name: Build SteamOS

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Debian 版本'
        type: choice
        options: [trixie, forky]
        default: 'trixie'
      desktop:
        description: '桌面环境'
        type: choice
        options: [gamescope, kde, gnome, server]
        default: 'gamescope'
      launcher:
        description: '游戏启动�?
        type: choice
        options: [steam, both, retroarch]
        default: 'steam'
      boot_mode:
        description: '启动模式'
        type: choice
        options: ['dual (linux)', 'single (userdata)']
        default: 'dual (linux)'
      autologin:
        description: '自动登录'
        type: boolean
        default: true
      username:
        description: '用户�?
        type: string
        default: 'gamer'
      hostname:
        description: '主机�?
        type: string
        default: 'sheng-steamos'
      kernel_source:
        description: '内核来源'
        type: choice
        options: [prebuilt, custom_build]
        default: 'prebuilt'
      kernel_repo:
        description: '内核仓库 (custom_build)'
        type: string
        default: 'https://github.com/ianchb/sm8550-mainline'
      kernel_branch:
        description: '内核分支 (custom_build)'
        type: string
        default: 'sheng-7.1.5'
      kernel_config:
        description: '内核配置文件 (custom_build)'
        type: string
        default: 'sm8550.config'
      firmware_repo:
        description: '固件仓库'
        type: string
        default: 'https://github.com/ianchb/sheng-firmware'
      firmware_branch:
        description: '固件分支'
        type: string
        default: 'master'
      skip_release:
        description: '跳过创建 Release'
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - 'sheng-steamos_build.sh'
      - 'lib/gaming-packages.sh'
      - 'lib/rootfs-common.sh'
      - '.github/workflows/build-steamos.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# =============================================================================
# 并行组件构建 Jobs
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # 内核 (可�? 自定义编�?
  # ---------------------------------------------------------------------------
  build-kernel:
    name: "Build Kernel"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: "Skip (Prebuilt)"
        if: ${{ inputs.kernel_source != 'custom_build' }}
        run: echo "�?使用预编译内核，跳过构建"

      - name: "Checkout"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        uses: actions/checkout@v4

      - name: "Install Build Tools"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev bc \
            ccache clang llvm lld

      - name: "Restore ccache"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-kernel-${{ inputs.kernel_branch }}-${{ hashFiles(inputs.kernel_config) }}

      - name: "Build Kernel"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        id: build
        run: |
          git clone "${{ inputs.kernel_repo }}" --branch "${{ inputs.kernel_branch }}" --depth 1 linux
          cp "${{ inputs.kernel_config }}" linux/.config
          cd linux
          export CCACHE_DIR=/home/runner/.ccache
          export PATH="/usr/lib/ccache:$PATH"
          export CC="ccache clang"
          make -j$(nproc) ARCH=arm64 LLVM=1
          KVER="$(make kernelrelease -s)"
          echo "kernel_version=$KVER" >> $GITHUB_OUTPUT

          make -j$(nproc) ARCH=arm64 LLVM=1 \
            INSTALL_MOD_PATH="${{ github.workspace }}/linux-xiaomi-sheng" modules_install
          rm -rf "${{ github.workspace }}/linux-xiaomi-sheng/lib/modules/"*"/build"

          mkdir -p "${{ github.workspace }}/linux-xiaomi-sheng/boot"
          install -Dm644 arch/arm64/boot/Image.gz "${{ github.workspace }}/linux-xiaomi-sheng/boot/Image.gz"
          install -Dm644 arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb "${{ github.workspace }}/linux-xiaomi-sheng/boot/sm8550-xiaomi-sheng.dtb"

          cat arch/arm64/boot/Image.gz arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb \
            > "${{ github.workspace }}/Image.gz-dtb_sheng"

      - name: "Package Kernel .deb"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        run: |
          KVER="${{ steps.build.outputs.kernel_version }}"
          mkdir -p linux-xiaomi-sheng/DEBIAN
          cat > linux-xiaomi-sheng/DEBIAN/control << EOF
          Package: linux-xiaomi-sheng
          Version: ${KVER}
          Architecture: arm64
          Section: kernel
          Description: Kernel and Modules for Xiaomi Pad 6S Pro
          EOF
          dpkg-deb --build --root-owner-group linux-xiaomi-sheng

      - name: "Upload"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-deb
          path: linux-xiaomi-sheng.deb
          retention-days: 3

      - name: "Upload Image"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: Image.gz-dtb_sheng
          retention-days: 3

  # ---------------------------------------------------------------------------
  # fastrpc �?Qualcomm FastRPC
  # ---------------------------------------------------------------------------
  build-fastrpc:
    name: "Build fastrpc"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Build"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libyaml-dev linux-libc-dev
          wget -q https://github.com/qualcomm/fastrpc/archive/refs/tags/v1.0.2.zip
          unzip -q v1.0.2.zip
          cd fastrpc-1.0.2
          autoreconf -is
          ./configure --prefix=/usr
          make -j$(nproc)
          make DESTDIR=$PWD/stage install

      - name: "Add Service"
        run: |
          mkdir -p fastrpc-1.0.2/stage/usr/lib/systemd/system
          cp patches/adsprpcd-sensorspd.service fastrpc-1.0.2/stage/usr/lib/systemd/system/

      - name: "Package"
        run: |
          mkdir -p deb/DEBIAN
          cp -r fastrpc-1.0.2/stage/usr deb/
          cat > deb/DEBIAN/control << EOF
          Package: fastrpc
          Version: 1.0.2-1
          Architecture: arm64
          Depends: libyaml-0-2, systemd
          Description: Qualcomm FastRPC userspace library
          EOF
          find deb -type d -exec chmod 755 {} \;
          find deb -type f -exec chmod 644 {} \;
          chmod 755 deb/usr/bin/adsprpcd
          dpkg-deb --build deb
          mv deb.deb fastrpc_1.0.2-1_arm64.deb

      - name: "Upload"
        uses: actions/upload-artifact@v4
        with:
          name: fastrpc-deb
          path: fastrpc_*.deb
          retention-days: 3

  # ---------------------------------------------------------------------------
  # libssc �?高通传感器核心�?  # ---------------------------------------------------------------------------
  build-libssc:
    name: "Build libssc"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Build"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config python3-pip \
            libglib2.0-dev libprotobuf-c-dev libqmi-glib-dev libmbim-glib-dev linux-libc-dev \
            protobuf-compiler protobuf-c-compiler
          pip3 install --upgrade meson
          git clone https://codeberg.org/DylanVanAssche/libssc.git source
          cd source
          [ -f "${{ github.workspace }}/patches/wait_for_qmi_service.patch" ] && \
            patch -Np1 < "${{ github.workspace }}/patches/wait_for_qmi_service.patch" || true
          meson setup build --prefix=/usr
          meson compile -C build
          DESTDIR=$PWD/stage meson install -C build

      - name: "Package"
        run: |
          mkdir -p deb/DEBIAN deb/usr
          cp -r source/stage/usr/* deb/usr/
          cat > deb/DEBIAN/control << EOF
          Package: libssc
          Version: 0.3.0-1
          Architecture: arm64
          Depends: libglib2.0-0, libprotobuf-c1, libqmi-glib5
          Description: Qualcomm Sensor Core userspace library
          EOF
          chmod 755 deb/usr/bin/ssccli
          dpkg-deb --build deb
          mv deb.deb libssc_0.3.0-1_arm64.deb

      - name: "Upload"
        uses: actions/upload-artifact@v4
        with:
          name: libssc-deb
          path: libssc_*.deb
          retention-days: 3

  # ---------------------------------------------------------------------------
  # iio-sensor-proxy (依赖 libssc)
  # ---------------------------------------------------------------------------
  build-iio-sensor-proxy:
    name: "Build iio-sensor-proxy"
    runs-on: ubuntu-24.04-arm
    needs: [build-libssc]
    steps:
      - name: "Install Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config libglib2.0-dev \
            libgudev-1.0-dev libpolkit-gobject-1-dev linux-libc-dev
          pip3 install --upgrade meson

      - name: "Download libssc"
        uses: actions/download-artifact@v4
        with: { name: libssc-deb }

      - name: "Install libssc"
        run: sudo dpkg -i libssc_*.deb && sudo ldconfig

      - name: "Build"
        run: |
          wget -q https://gitlab.freedesktop.org/hadess/iio-sensor-proxy/-/archive/3.9/iio-sensor-proxy-3.9.tar.gz
          tar -xf iio-sensor-proxy-3.9.tar.gz
          cd iio-sensor-proxy-3.9
          meson setup output --prefix=/usr -Dssc-support=enabled -Dsystemdsystemunitdir=/usr/lib/systemd/system
          meson compile -C output
          DESTDIR=$PWD/stage meson install --no-rebuild -C output

      - name: "Package"
        run: |
          mkdir -p deb/DEBIAN
          cp -r iio-sensor-proxy-3.9/stage/usr deb/
          cat > deb/DEBIAN/control << EOF
          Package: iio-sensor-proxy
          Version: 99993.9-6
          Architecture: arm64
          Depends: dbus, libglib2.0-0, libgudev-1.0-0
          Description: IIO sensors to D-Bus proxy (SSC patched)
          EOF
          chmod 755 deb/usr/bin/monitor-sensor deb/usr/libexec/iio-sensor-proxy
          dpkg-deb --build deb
          mv deb.deb iio-sensor-proxy_99993.9-6_arm64.deb

      - name: "Upload"
        uses: actions/upload-artifact@v4
        with:
          name: iio-sensor-proxy-deb
          path: iio-sensor-proxy_*.deb
          retention-days: 3

  # ---------------------------------------------------------------------------
  # sheng-sensors �?传感器配置文�?  # ---------------------------------------------------------------------------
  build-sheng-sensors:
    name: "Build sheng-sensors"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Package"
        run: |
          mkdir -p deb/DEBIAN
          cp -r sheng-sensors-files/usr deb/
          cat > deb/DEBIAN/control << EOF
          Package: sheng-sensors
          Version: 20240917-1
          Architecture: arm64
          Description: Sensor configuration files for Xiaomi Pad 6S Pro
          EOF
          dpkg-deb --build deb
          mv deb.deb sheng-sensors_20240917-1_arm64.deb

      - name: "Upload"
        uses: actions/upload-artifact@v4
        with:
          name: sheng-sensors-deb
          path: sheng-sensors_*.deb
          retention-days: 3

  # ---------------------------------------------------------------------------
  # sheng-devauth �?键盘认证守护进程
  # ---------------------------------------------------------------------------
  build-sheng-devauth:
    name: "Build sheng-devauth"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Build & Package"
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential
          git clone https://github.com/ianchb/sheng_devauth.git source
          cd source && make
          mkdir -p ../deb/usr/bin
          cp xiaomi_devauth ../deb/usr/bin/
          chmod 755 ../deb/usr/bin/xiaomi_devauth
          mkdir -p ../deb/DEBIAN
          cat > ../deb/DEBIAN/control << EOF
          Package: sheng-devauth
          Version: 1.0.0-1
          Architecture: arm64
          Description: Keyboard authentication daemon for Xiaomi Pad 6S Pro
          EOF
          cd .. && dpkg-deb --build --root-owner-group deb
          mv deb.deb sheng-devauth_1.0.0-1_arm64.deb

      - name: "Upload"
        uses: actions/upload-artifact@v4
        with:
          name: sheng-devauth-deb
          path: sheng-devauth_*.deb
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 固件 + ALSA (inline 打包)
  # ---------------------------------------------------------------------------
  build-firmware-alsa:
    name: "Build firmware & ALSA"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Package firmware"
        run: |
          git clone --depth 1 --branch "${{ inputs.firmware_branch }}" \
            "${{ inputs.firmware_repo }}" firmware-src
          mkdir -p firmware-xiaomi-sheng/usr/lib/firmware
          cp -r firmware-src/* firmware-xiaomi-sheng/usr/lib/firmware/
          dpkg-deb --build --root-owner-group firmware-xiaomi-sheng

      - name: "Package ALSA"
        run: |
          dpkg-deb --build --root-owner-group alsa-xiaomi-sheng

      - name: "Download external .debs"
        run: |
          for repo in xiaomi-mipps-auth xiaomi-charger-mode xiaomi-sheng-thp \
                      xiaomi-pen-status xiaomi-sheng-fingerprint xiaomi-sheng-keyboard-helper; do
            TAG=$(gh release list --repo "ianchb/$repo" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
            if [ -n "$TAG" ]; then
              gh release download "$TAG" --repo "ianchb/$repo" --pattern "*.deb" --clobber 2>/dev/null || true
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Upload"
        uses: actions/upload-artifact@v4
        with:
          name: firmware-alsa-deb
          path: |
            *.deb
          retention-days: 3

  # ---------------------------------------------------------------------------
  # RootFS 组装 �?收集所�?.deb，debootstrap 构建最终镜�?  # ---------------------------------------------------------------------------
  build-rootfs:
    name: "Build RootFS"
    runs-on: ubuntu-24.04-arm
    needs:
      - build-kernel
      - build-fastrpc
      - build-libssc
      - build-iio-sensor-proxy
      - build-sheng-sensors
      - build-sheng-devauth
      - build-firmware-alsa
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap p7zip-full libarchive-tools

      - name: "Parse Boot Mode"
        id: boot
        run: |
          case "${{ inputs.boot_mode }}" in
            'dual (linux)')   echo "label=linux" >> $GITHUB_OUTPUT ;;
            'single (userdata)') echo "label=userdata" >> $GITHUB_OUTPUT ;;
          esac

      # ---- 下载所有组�?.deb ----
      - name: "Download kernel"
        if: ${{ inputs.kernel_source == 'prebuilt' }}
        run: |
          TAG=$(gh release list --repo ianchb/sm8550-mainline --limit 1 --json tagName -q '.[0].tagName')
          gh release download "$TAG" --repo ianchb/sm8550-mainline --pattern "linux-xiaomi-sheng*.deb" --clobber
          gh release download "$TAG" --repo ianchb/sm8550-mainline --pattern "boot_sheng_*.img" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Download kernel (custom)"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        uses: actions/download-artifact@v4
        with: { name: kernel-deb }

      - name: "Download all component .debs"
        uses: actions/download-artifact@v4
        with:
          pattern: "*-deb"
          merge-multiple: true

      - name: "Download firmware & ALSA"
        uses: actions/download-artifact@v4
        with:
          name: firmware-alsa-deb

      - name: "Verify .deb files"
        run: |
          echo "=== 已收集的 .deb �?==="
          ls -lah *.deb 2>/dev/null || echo "(�?.deb 文件!)"

      # ---- 构建 RootFS ----
      - name: "Build SteamOS Image"
        id: build
        run: |
          PARTLABEL="${{ steps.boot.outputs.label }}"
          chmod +x sheng-steamos_build.sh lib/*.sh

          sudo bash sheng-steamos_build.sh \
            --suite="${{ inputs.suite }}" \
            --desktop="${{ inputs.desktop }}" \
            --launcher="${{ inputs.launcher }}" \
            --boot="${{ inputs.boot_mode == 'dual (linux)' && 'dual' || 'single' }}" \
            --autologin="${{ inputs.autologin }}" \
            --username="${{ inputs.username }}" \
            --hostname="${{ inputs.hostname }}" \
            --output=image \
            --mode=ci

          # 收集产物
          ls -lah *.7z *.img 2>/dev/null || true
          echo "build_done=true" >> $GITHUB_OUTPUT

      # ---- 生成 boot.img (自定义内�? ----
      - name: "Generate boot.img (custom kernel)"
        if: ${{ inputs.kernel_source == 'custom_build' }}
        run: |
          PARTLABEL="${{ steps.boot.outputs.label }}"
          chmod +x mkbootimg 2>/dev/null || true
          if [ -f mkbootimg ] && [ -f Image.gz-dtb_sheng ]; then
            ./mkbootimg \
              --kernel Image.gz-dtb_sheng \
              --cmdline "root=PARTLABEL=$PARTLABEL rootwait" \
              --base 0x00000000 \
              --kernel_offset 0x00008000 \
              --tags_offset 0x01e00000 \
              --pagesize 4096 \
              -o boot.img
          fi

      # ---- 上传产物 ----
      - name: "Upload RootFS"
        uses: actions/upload-artifact@v4
        with:
          name: steamos-rootfs
          path: "*.7z"
          retention-days: 14
          compression-level: 1

      - name: "Upload Boot Image"
        uses: actions/upload-artifact@v4
        with:
          name: steamos-boot
          path: boot*.img
          retention-days: 14
          if-no-files-found: ignore

      - name: "Upload Package List"
        uses: actions/upload-artifact@v4
        with:
          name: steamos-pkglist
          path: sheng-steamos_packages_*.txt
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 创建 Release
  # ---------------------------------------------------------------------------
  create-release:
    name: "Create Release"
    runs-on: ubuntu-24.04-arm
    needs: [build-rootfs]
    if: ${{ !inputs.skip_release && needs.build-rootfs.result == 'success' }}
    steps:
      - name: "Generate Tag"
        id: tag
        run: echo "tag=steamos-$(date -u '+%Y%m%d')-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: "Download RootFS"
        uses: actions/download-artifact@v4
        with: { name: steamos-rootfs }

      - name: "Download Boot"
        uses: actions/download-artifact@v4
        with: { name: steamos-boot }

      - name: "Create Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "SteamOS ${{ steps.tag.outputs.tag }}"
          body: |
            **SteamOS 风格游戏系统 (Debian ${{ inputs.suite }} arm64)**

            | 项目 | 详情 |
            |------|------|
            | 基础系统 | Debian ${{ inputs.suite }} (debootstrap) |
            | 桌面 | ${{ inputs.desktop }} |
            | 启动�?| ${{ inputs.launcher }} |
            | 启动模式 | ${{ inputs.boot_mode }} |
            | 架构 | 并行 .deb 组件构建 + debootstrap 组装 |

            ### 组件
            - 原生 ARM64 Steam 客户�?+ Proton ARM64
            - FEX-Emu (x86/x64 转译)
            - Gamescope 微合成器
            - 设备专用: fastrpc, libssc, iio-sensor-proxy, sensors, devauth, firmware, ALSA
            - 触摸屏、手写笔、指纹、键盘、快充支�?          files: |
            *.7z
            boot*.img
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Publish"
        run: gh release edit "${{ steps.tag.outputs.tag }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
